name: Starter Town Browser Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'tools/browser-smoke.mjs'
      - 'package.json'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'tools/browser-smoke.mjs'
      - 'package.json'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Boot and enter Starter Town
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run browser smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/browser-smoke.mjs
