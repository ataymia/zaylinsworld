name: Deploy ZTA Asset Forge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'asset-forge/**'
      - '.github/workflows/deploy-asset-forge.yml'

permissions:
  contents: read

concurrency:
  group: zta-asset-forge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset-forge
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
      ASSET_FORGE_ADMIN_KEY: ${{ secrets.ASSET_FORGE_ADMIN_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install Wrangler
        run: npm install

      - name: Validate Worker bundle
        run: npm run check

      - name: Deploy Worker and provision Cloudflare resources
        run: npm run deploy

      - name: Apply D1 migrations
        run: npm run migrate

      - name: Upload Meshy API key to Worker
        if: ${{ env.MESHY_API_KEY != '' }}
        run: printf '%s' "$MESHY_API_KEY" | npx wrangler secret put MESHY_API_KEY

      - name: Upload Asset Forge admin key to Worker
        if: ${{ env.ASSET_FORGE_ADMIN_KEY != '' }}
        run: printf '%s' "$ASSET_FORGE_ADMIN_KEY" | npx wrangler secret put ASSET_FORGE_ADMIN_KEY
