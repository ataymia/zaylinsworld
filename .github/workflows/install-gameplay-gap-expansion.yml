name: Bootstrap Repaired Expanded Asset Factory

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/asset-factory/install-gameplay-gap-expansion.mjs'
      - 'tools/asset-factory/factory-patch-payload/**'
      - '.github/workflows/install-gameplay-gap-expansion.yml'
  pull_request:
    paths:
      - 'tools/asset-factory/install-gameplay-gap-expansion.mjs'
      - 'tools/asset-factory/factory-patch-payload/**'
      - '.github/workflows/install-gameplay-gap-expansion.yml'

permissions:
  contents: write

concurrency:
  group: zta-bootstrap-expanded-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout expansion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify and install repaired factory source
        run: node tools/asset-factory/install-gameplay-gap-expansion.mjs

      - name: Validate repaired source syntax
        run: |
          node --check tools/asset-factory/compile-expanded-specs.mjs
          node --check tools/asset-factory/apply-gameplay-gap-catalog-v2.mjs
          node --check tools/asset-factory/promote-safe-builders.mjs
          node --check tools/asset-factory/build-runtime-deliverables.mjs
          node --check tools/asset-factory/audit-factory-health.mjs
          node --check tools/asset-factory/run-batch.mjs
          node --check tools/asset-factory/check-gameplay-gap-catalog-v2.mjs
          node --check tools/asset-factory/check-inventory-intent.mjs
          node --check tools/asset-factory/check-sharded-deep-specs.mjs
          python3 -m py_compile \
            tools/asset-factory/blender/builder_repair_utils.py \
            tools/asset-factory/blender/builder_repairs_legacy.py \
            tools/asset-factory/blender/builder_repairs_modular.py \
            tools/asset-factory/blender/builder_repairs.py \
            tools/asset-factory/blender/generate_batch.py

      - name: Materialize expanded library and runtime assets
        shell: bash
        run: |
          mkdir -p reports/asset-factory
          set -o pipefail
          npm run asset:materialize 2>&1 | tee reports/asset-factory/materialize.log

      - name: Commit repaired source and generated library
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          rm -rf tools/asset-factory/factory-patch-payload
          rm -f tools/asset-factory/install-gameplay-gap-expansion.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repaired factory changes to commit."
            exit 0
          fi
          git commit -m "Apply repaired expanded asset factory and materialize library [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload bootstrap proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zta-repaired-factory-bootstrap-${{ github.run_number }}
          path: |
            tools/asset-factory/factory-patch-files.json
            asset-factory/gameplay-gaps/
            asset-factory/generated/master-asset-specs.json
            asset-factory/generated/deep-asset-specs.json
            asset-factory/generated/deep-spec-coverage.json
            asset-factory/generated/deep-specs/
            asset-factory/state/queue.json
            asset-factory/state/builder-health.json
            public/assets/runtime/generated/
            public/assets/decals/generated/
            reports/asset-factory/
          if-no-files-found: warn
          retention-days: 7
