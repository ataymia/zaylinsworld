name: Runtime Asset Audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'tools/audit-assets.mjs'
      - 'public/assets/models/**'
      - 'package.json'
      - '.github/workflows/asset-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/audit-assets.mjs'
      - 'public/assets/models/**'
      - 'package.json'
      - '.github/workflows/asset-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Inventory runtime assets without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime asset inventory
        run: npm run audit:assets

      - name: Upload asset inventory
        uses: actions/upload-artifact@v4
        with:
          name: runtime-asset-inventory
          path: |
            docs/ASSET_INVENTORY.md
            docs/asset-inventory.json
          if-no-files-found: error
          retention-days: 14
