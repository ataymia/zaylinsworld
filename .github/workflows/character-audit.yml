name: Character Asset Audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'tools/audit-characters.mjs'
      - 'public/assets/models/asset-index-v2.json'
      - 'public/assets/models/characters/**'
      - 'package.json'
      - '.github/workflows/character-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Inspect indexed character GLBs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate character audit
        run: npm run audit:characters

      - name: Upload character audit
        uses: actions/upload-artifact@v4
        with:
          name: character-asset-audit
          path: |
            docs/CHARACTER_ASSET_AUDIT.md
            docs/character-asset-audit.json
          if-no-files-found: error
          retention-days: 14
