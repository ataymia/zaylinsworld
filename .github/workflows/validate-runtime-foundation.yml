name: Validate Runtime Foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/check-runtime-foundation.mjs'
      - 'tools/check-player-runtime.mjs'
      - 'tools/check-character-policy.mjs'
      - 'tools/check-source.mjs'
      - 'tools/smoke-structure.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-runtime-foundation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/check-runtime-foundation.mjs'
      - 'tools/check-player-runtime.mjs'
      - 'tools/check-character-policy.mjs'
      - 'tools/check-source.mjs'
      - 'tools/smoke-structure.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-runtime-foundation.yml'

permissions:
  contents: read

concurrency:
  group: zaylins-runtime-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete game quality gate
        run: npm run check
