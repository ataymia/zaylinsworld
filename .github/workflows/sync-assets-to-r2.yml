name: Sync Game Assets to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Binary asset scope to synchronize
        required: false
        type: choice
        options:
          - generated
          - all
        default: generated
  pull_request:
    paths:
      - 'tools/cloudflare/**'
      - 'cloudflare/**'
      - 'src/assets.js'
      - 'public/assets/remote-asset-manifest.json'
      - '.github/workflows/sync-assets-to-r2.yml'
  push:
    branches: [main, agent/gameplay-gap-asset-expansion]
    paths:
      - 'public/assets/models/generated/**'
      - 'public/assets/textures/generated/**'
      - 'public/assets/audio/generated/**'
      - 'tools/cloudflare/**'
      - 'cloudflare/**'
      - 'src/assets.js'
      - '.github/workflows/sync-assets-to-r2.yml'

permissions:
  contents: write

concurrency:
  group: zaylins-r2-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'push' || vars.R2_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'zaylins-assets' }}
      R2_ASSET_DOMAIN: ${{ vars.R2_ASSET_DOMAIN }}
      R2_ASSET_BASE_URL: ${{ vars.R2_ASSET_BASE_URL }}
      SYNC_SCOPE: ${{ github.event.inputs.scope || 'generated' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate synchronization source
        run: node --check tools/cloudflare/build-r2-upload-plan.mjs

      - name: Build content-addressed upload plan
        shell: bash
        run: |
          BASE_URL="$R2_ASSET_BASE_URL"
          if [[ -z "$BASE_URL" && -n "$R2_ASSET_DOMAIN" ]]; then
            BASE_URL="https://$R2_ASSET_DOMAIN"
          fi
          node tools/cloudflare/build-r2-upload-plan.mjs \
            --scope "$SYNC_SCOPE" \
            --base-url "$BASE_URL" \
            --output reports/asset-factory/r2-upload-plan.tsv \
            --manifest public/assets/remote-asset-manifest.json
          wc -l reports/asset-factory/r2-upload-plan.tsv

      - name: Require Cloudflare deployment credentials
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured as GitHub Actions secrets."
            exit 1
          fi
          echo "Cloudflare account credentials are available to Actions."

      - name: Install current Wrangler
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@latest --version

      - name: Diagnose Cloudflare account and ensure R2 bucket exists
        id: r2
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/asset-factory
          LOG=reports/asset-factory/r2-cloudflare-diagnostic.log
          : > "$LOG"
          {
            echo "== Wrangler identity =="
            npx --yes wrangler@latest whoami || true
            echo
            echo "== R2 bucket list =="
            npx --yes wrangler@latest r2 bucket list || true
            echo
            echo "== Requested bucket info: $R2_BUCKET =="
          } 2>&1 | tee -a "$LOG"

          if npx --yes wrangler@latest r2 bucket info "$R2_BUCKET" --json 2>&1 | tee /tmp/r2-bucket-info-attempt.log | tee -a "$LOG"; then
            cp /tmp/r2-bucket-info-attempt.log /tmp/r2-bucket-info.json
            echo "R2 bucket $R2_BUCKET already exists." | tee -a "$LOG"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Bucket lookup failed. Attempting account-level bucket creation." | tee -a "$LOG"
          if npx --yes wrangler@latest r2 bucket create "$R2_BUCKET" 2>&1 | tee /tmp/r2-create.log | tee -a "$LOG"; then
            npx --yes wrangler@latest r2 bucket info "$R2_BUCKET" --json 2>&1 | tee /tmp/r2-bucket-info.json | tee -a "$LOG"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -qE '10042|enable R2|Please enable R2' /tmp/r2-create.log /tmp/r2-bucket-info-attempt.log 2>/dev/null; then
            echo "::warning::Cloudflare authentication succeeded, but R2 is not enabled for this account yet. Open R2 Object Storage in the Cloudflare dashboard and complete the one-time activation. Upload steps are safely skipped until then."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Cloudflare authentication succeeded, but R2 bucket access failed for a reason other than the known activation gate. Inspect the uploaded diagnostic and verify Account > Workers R2 Storage > Edit permission."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Configure read-only browser CORS
        if: github.event_name != 'pull_request' && steps.r2.outputs.enabled == 'true'
        run: |
          npx --yes wrangler@latest r2 bucket cors set "$R2_BUCKET" --file cloudflare/r2-cors.json
          npx --yes wrangler@latest r2 bucket cors list "$R2_BUCKET"

      - name: Attach optional production asset domain
        if: github.event_name != 'pull_request' && steps.r2.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -z "$R2_ASSET_DOMAIN" || -z "$CLOUDFLARE_ZONE_ID" ]]; then
            echo "Custom domain setup skipped. Set R2_ASSET_DOMAIN as a repository variable and CLOUDFLARE_ZONE_ID as a secret to automate it."
            exit 0
          fi
          if npx --yes wrangler@latest r2 bucket domain get "$R2_BUCKET" --domain "$R2_ASSET_DOMAIN" >/dev/null 2>&1; then
            echo "$R2_ASSET_DOMAIN is already attached to $R2_BUCKET."
          else
            npx --yes wrangler@latest r2 bucket domain add "$R2_BUCKET" \
              --domain "$R2_ASSET_DOMAIN" \
              --zone-id "$CLOUDFLARE_ZONE_ID" \
              --min-tls 1.2 \
              --force
          fi

      - name: Upload immutable binary objects
        if: github.event_name != 'pull_request' && steps.r2.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAN=reports/asset-factory/r2-upload-plan.tsv
          if [[ ! -s "$PLAN" ]]; then
            echo "No binary assets matched this synchronization scope."
            exit 0
          fi
          uploaded=0
          while IFS=$'\t' read -r source key content_type cache_control hash size; do
            npx --yes wrangler@latest r2 object put "$R2_BUCKET/$key" \
              --file="$source" \
              --content-type="$content_type" \
              --cache-control="$cache_control" \
              --remote
            uploaded=$((uploaded + 1))
            echo "[$uploaded] $source -> $key ($size bytes)"
          done < "$PLAN"
          echo "Uploaded $uploaded immutable objects to R2."

      - name: Verify an uploaded object by checksum
        if: github.event_name != 'pull_request' && steps.r2.outputs.enabled == 'true'
        shell: bash
        run: |
          PLAN=reports/asset-factory/r2-upload-plan.tsv
          if [[ ! -s "$PLAN" ]]; then exit 0; fi
          IFS=$'\t' read -r source key content_type cache_control hash size < "$PLAN"
          npx --yes wrangler@latest r2 object get "$R2_BUCKET/$key" \
            --file=/tmp/zaylins-r2-verify.bin \
            --remote
          echo "$hash  /tmp/zaylins-r2-verify.bin" | sha256sum --check --strict
          echo "Verified $key against its SHA-256 content address."

      - name: Commit compact remote manifest
        if: github.event_name != 'pull_request' && steps.r2.outputs.enabled == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/remote-asset-manifest.json
          if git diff --cached --quiet; then
            echo "Remote asset manifest is already current."
            exit 0
          fi
          git commit -m "Update Cloudflare R2 asset manifest [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload R2 synchronization proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zaylins-r2-sync-${{ github.run_number }}
          path: |
            /tmp/r2-bucket-info.json
            reports/asset-factory/r2-cloudflare-diagnostic.log
            reports/asset-factory/r2-upload-plan.tsv
            public/assets/remote-asset-manifest.json
          if-no-files-found: warn
          retention-days: 7
