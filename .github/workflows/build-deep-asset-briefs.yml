name: Build Deep Asset Briefs

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/asset-factory/enrich-all-specs.mjs'
      - 'tools/asset-factory/normalize-deep-specs.mjs'
      - 'tools/asset-factory/deep-spec-semantics.mjs'
      - 'tools/asset-factory/refine-deep-semantics.mjs'
      - 'tools/asset-factory/deep-spec-final-classifier.mjs'
      - 'tools/asset-factory/finalize-deep-semantics.mjs'
      - 'tools/asset-factory/derive-physical-specs.mjs'
      - 'tools/asset-factory/specialize-physical-specs.mjs'
      - 'tools/asset-factory/classify-inventory-intent.mjs'
      - 'tools/asset-factory/check-deep-specs.mjs'
      - 'tools/asset-factory/check-physical-specs.mjs'
      - 'tools/asset-factory/check-specialized-physical-specs.mjs'
      - 'tools/asset-factory/check-inventory-intent.mjs'
      - 'asset-factory/quality-policy.json'
      - 'asset-factory/manual-overrides.json'
      - 'asset-factory/generated/master-asset-specs.json'
      - 'docs/**/*.md'
      - '.github/workflows/build-deep-asset-briefs.yml'
  pull_request:
    paths:
      - 'tools/asset-factory/enrich-all-specs.mjs'
      - 'tools/asset-factory/normalize-deep-specs.mjs'
      - 'tools/asset-factory/deep-spec-semantics.mjs'
      - 'tools/asset-factory/refine-deep-semantics.mjs'
      - 'tools/asset-factory/deep-spec-final-classifier.mjs'
      - 'tools/asset-factory/finalize-deep-semantics.mjs'
      - 'tools/asset-factory/derive-physical-specs.mjs'
      - 'tools/asset-factory/specialize-physical-specs.mjs'
      - 'tools/asset-factory/classify-inventory-intent.mjs'
      - 'tools/asset-factory/check-deep-specs.mjs'
      - 'tools/asset-factory/check-physical-specs.mjs'
      - 'tools/asset-factory/check-specialized-physical-specs.mjs'
      - 'tools/asset-factory/check-inventory-intent.mjs'
      - 'asset-factory/quality-policy.json'
      - 'asset-factory/manual-overrides.json'
      - 'asset-factory/generated/master-asset-specs.json'
      - 'docs/**/*.md'
      - '.github/workflows/build-deep-asset-briefs.yml'

permissions:
  contents: write

concurrency:
  group: zta-deep-asset-briefs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source syntax
        run: |
          node --check tools/asset-factory/enrich-all-specs.mjs
          node --check tools/asset-factory/normalize-deep-specs.mjs
          node --check tools/asset-factory/deep-spec-semantics.mjs
          node --check tools/asset-factory/refine-deep-semantics.mjs
          node --check tools/asset-factory/deep-spec-final-classifier.mjs
          node --check tools/asset-factory/finalize-deep-semantics.mjs
          node --check tools/asset-factory/derive-physical-specs.mjs
          node --check tools/asset-factory/specialize-physical-specs.mjs
          node --check tools/asset-factory/classify-inventory-intent.mjs
          node --check tools/asset-factory/check-deep-specs.mjs
          node --check tools/asset-factory/check-physical-specs.mjs
          node --check tools/asset-factory/check-specialized-physical-specs.mjs
          node --check tools/asset-factory/check-inventory-intent.mjs

      - name: Generate deep production briefs for the complete asset library
        run: node tools/asset-factory/enrich-all-specs.mjs

      - name: Expand sparse blueprint-list context
        run: node tools/asset-factory/normalize-deep-specs.mjs

      - name: Build category-specific doctrine
        run: node tools/asset-factory/refine-deep-semantics.mjs

      - name: Resolve final physical-object categories
        run: node tools/asset-factory/finalize-deep-semantics.mjs

      - name: Replace weak compact placeholders with object-specific physical specs
        run: node tools/asset-factory/derive-physical-specs.mjs

      - name: Specialize ambiguous and remaining broad physical profiles
        run: node tools/asset-factory/specialize-physical-specs.mjs

      - name: Rebuild descriptions from corrected specialized dimensions and components
        run: node tools/asset-factory/finalize-deep-semantics.mjs

      - name: Separate canonical requests from documentation and existing-asset references
        run: node tools/asset-factory/classify-inventory-intent.mjs

      - name: Require complete unique physically consistent coverage
        run: node tools/asset-factory/check-deep-specs.mjs

      - name: Reject inherited placeholder dimensions and components
        run: node tools/asset-factory/check-physical-specs.mjs

      - name: Require specialized profiles for every derived asset
        run: node tools/asset-factory/check-specialized-physical-specs.mjs

      - name: Require audited generation eligibility for every record
        run: node tools/asset-factory/check-inventory-intent.mjs

      - name: Commit generated specification library
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-factory/generated/deep-asset-specs.json
          git add asset-factory/generated/deep-spec-coverage.json
          if git diff --cached --quiet; then
            echo "Deep asset specification library is already current."
            exit 0
          fi
          git commit -m "Generate all deep asset production briefs [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload deep specification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zta-deep-asset-briefs-${{ github.run_number }}
          path: |
            asset-factory/generated/deep-asset-specs.json
            asset-factory/generated/deep-spec-coverage.json
          if-no-files-found: warn
          retention-days: 7
