name: Validate Expanded Asset Library

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'asset-factory/gameplay-gaps/**'
      - 'asset-factory/manual-overrides.json'
      - 'asset-factory/quality-policy.json'
      - 'tools/asset-factory/**'
      - 'docs/**/*BLUEPRINT.md'
      - 'docs/FINAL_GAMEPLAY_GAPS.md'
      - 'package.json'
      - '.github/workflows/build-deep-asset-briefs.yml'
  push:
    branches: [main, agent/gameplay-gap-asset-expansion]
    paths:
      - 'asset-factory/gameplay-gaps/**'
      - 'asset-factory/manual-overrides.json'
      - 'asset-factory/quality-policy.json'
      - 'tools/asset-factory/**'
      - 'docs/**/*BLUEPRINT.md'
      - 'docs/FINAL_GAMEPLAY_GAPS.md'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: zta-expanded-deep-asset-briefs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and validate all 2,298 production briefs
        shell: bash
        run: |
          mkdir -p reports/asset-factory
          set -o pipefail
          npm run asset:deep 2>&1 | tee reports/asset-factory/deep-validation.log

      - name: Commit validated catalogs and bounded shards
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-factory/gameplay-gaps/
          git add asset-factory/generated/
          git add asset-factory/state/
          git add docs/FINAL_GAMEPLAY_GAPS.md
          git add reports/asset-factory/deep-validation.log
          if git diff --cached --quiet; then
            echo "Expanded asset library is already current."
            exit 0
          fi
          git commit -m "Validate expanded asset production briefs [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload validation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zta-expanded-asset-library-${{ github.run_number }}
          path: |
            reports/asset-factory/deep-validation.log
            asset-factory/gameplay-gaps/summary.json
            asset-factory/generated/deep-asset-specs.json
            asset-factory/generated/deep-spec-coverage.json
            asset-factory/generated/deep-specs/
            asset-factory/state/queue.json
          if-no-files-found: warn
          retention-days: 7
