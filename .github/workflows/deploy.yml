name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build production bundles
        run: npm run build
        env:
          ZTA_PAGES_DEPLOYMENT: '1'
      - name: Assemble Starter Town runtime assets
        run: |
          mkdir -p dist/assets/models/generated
          cp public/sw.js dist/
          cp -R public/assets/decals dist/assets/
          cp -R public/assets/hdr dist/assets/
          cp -R public/assets/runtime dist/assets/
          cp -R public/assets/textures dist/assets/
          cp -R public/assets/models/animations dist/assets/models/
          cp -R public/assets/models/characters dist/assets/models/
          cp -R public/assets/models/hair dist/assets/models/
          cp -R public/assets/models/jewelry dist/assets/models/
          cp -R public/assets/models/props dist/assets/models/
          cp -R public/assets/models/vehicles dist/assets/models/
          cp -R public/assets/models/weapons dist/assets/models/
          cp -R public/assets/models/generated/shared-world dist/assets/models/generated/
          cp -R public/assets/models/generated/starter-town dist/assets/models/generated/
          cp public/assets/models/asset-index-v2.json dist/assets/models/
          cp public/assets/models/kits-index.json dist/assets/models/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
