name: Promote Proven Expanded Asset Factory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/asset-factory/promote-materialized-trigger.txt'
      - '.github/workflows/promote-expanded-asset-factory.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: zta-promote-expanded-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout materialization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify and install repaired source
        run: node tools/asset-factory/install-gameplay-gap-expansion.mjs

      - name: Preserve audited generation eligibility and bounded sharding
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const applyPath = 'tools/asset-factory/apply-gameplay-gap-catalog-v2.mjs';
          const source = readFileSync(applyPath, 'utf8');
          const before = "const baseAssets = master.assets.filter((asset) => !gapIds.has(asset.id) && !gapFiles.has(asset.fileName));";
          const after = `const referenceOnlySources = new Set([
            'docs/ASSET_USAGE_REPORT.md',
            'docs/ASSET_CLEANUP_PLAN.md',
            'docs/CITY_BLUEPRINT_STANDARD.md',
            'docs/ASSET_CREATION_WORKFLOW.md',
          ]);
          const baseAssets = master.assets
            .filter((asset) => !gapIds.has(asset.id) && !gapFiles.has(asset.fileName))
            .map((asset) => ({
              ...asset,
              generationEligible: asset.generationEligible ?? !referenceOnlySources.has(asset.sourceDoc),
            }));`;
          if (!source.includes(before)) throw new Error('Expected baseline merge statement was not found.');
          writeFileSync(applyPath, source.replace(before, after));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          pkg.scripts['asset:shard-deep'] = 'node tools/asset-factory/bounded-shard-deep-specs.mjs';
          pkg.scripts['asset:check-shards'] = 'node tools/asset-factory/check-bounded-deep-shards.mjs';
          writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Download proven materialization artifact
        uses: actions/download-artifact@v4
        with:
          name: zta-repaired-factory-bootstrap-54
          path: /tmp/zta-proof
          repository: ataymia/zaylinsworld
          run-id: 29652925908
          github-token: ${{ github.token }}

      - name: Overlay proven generated outputs
        run: cp -a /tmp/zta-proof/. .

      - name: Validate promoted proof
        run: |
          node tools/asset-factory/check-gameplay-gap-catalog-v2.mjs
          node tools/asset-factory/check-bounded-deep-shards.mjs
          node tools/asset-factory/audit-factory-health.mjs

      - name: Commit source and proven outputs without workflow rewrites
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          mkdir -p reports/asset-factory
          set -o pipefail
          {
            rm -rf tools/asset-factory/factory-patch-payload
            rm -f tools/asset-factory/install-gameplay-gap-expansion.mjs
            rm -f tools/asset-factory/promote-materialized-trigger.txt
            for path in \
              .github/workflows/build-deep-asset-briefs.yml \
              .github/workflows/generate-free-asset-factory.yml \
              .github/workflows/install-gameplay-gap-expansion.yml \
              .github/workflows/materialize-expanded-asset-library.yml; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                mkdir -p "$(dirname "$path")"
                git show "HEAD:$path" > "$path"
              else
                rm -f "$path"
              fi
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --name-only | grep -q '^.github/workflows/'; then
              echo "Protected workflow changes remain staged; refusing promotion."
              git diff --cached --name-only | grep '^.github/workflows/'
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "No promoted factory changes to commit."
              exit 0
            fi
            git commit -m "Promote repaired expanded asset factory and proven library [skip ci]"
            git push origin "HEAD:$TARGET_BRANCH"
          } 2>&1 | tee reports/asset-factory/promotion.log

      - name: Upload promotion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zta-expanded-factory-promotion-${{ github.run_number }}
          path: |
            reports/asset-factory/promotion.log
            reports/asset-factory/health.json
            reports/asset-factory/health.md
            asset-factory/generated/deep-spec-coverage.json
            asset-factory/state/queue.json
          if-no-files-found: warn
          retention-days: 7
