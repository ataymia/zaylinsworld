name: Verify Priority Shape Builders

on:
  pull_request:
    paths:
      - 'tools/asset-factory/priority-builder-proof-trigger.txt'
      - 'asset-factory/priority-shape-overrides.json'
      - 'tools/asset-factory/blender/builder_repairs_priority.py'
      - 'tools/asset-factory/blender/builder_repairs_accessibility.py'
      - 'tools/asset-factory/blender/builder_repairs.py'
      - 'tools/asset-factory/promote-safe-builders.mjs'
      - '.github/workflows/verify-priority-builders.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Blender runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxi6 libxrender1 libxkbcommon0

      - name: Validate dedicated builder source
        run: |
          python3 -m py_compile \
            tools/asset-factory/blender/common.py \
            tools/asset-factory/blender/builder_repair_utils.py \
            tools/asset-factory/blender/builder_repairs_priority.py \
            tools/asset-factory/blender/builder_repairs_accessibility.py \
            tools/asset-factory/blender/builder_repairs.py \
            tools/asset-factory/blender/generate_batch.py
          node tools/asset-factory/compile-expanded-specs.mjs

      - name: Build exact priority proof batch
        run: |
          mkdir -p asset-factory/work reports/asset-factory
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const ids = [
            'gap-aqualume-airlock-conduit-straight-standard-105',
            'gap-shared-world-accessibility-gate-locked-standard-310',
          ];
          const master = JSON.parse(readFileSync('asset-factory/generated/master-asset-specs.json', 'utf8'));
          const byId = new Map(master.assets.map((asset) => [asset.id, asset]));
          const assets = ids.map((id) => {
            const asset = byId.get(id);
            if (!asset) throw new Error(`Missing targeted asset ${id}.`);
            return { ...asset, factoryAttempt: 1 };
          });
          const expected = {
            'gap-aqualume-airlock-conduit-straight-standard-105': 'airlock_conduit',
            'gap-shared-world-accessibility-gate-locked-standard-310': 'accessibility_gate',
          };
          for (const asset of assets) {
            if (asset.builder !== expected[asset.id]) {
              throw new Error(`${asset.id} routed to ${asset.builder}; expected ${expected[asset.id]}.`);
            }
          }
          writeFileSync('asset-factory/work/current-batch.json', `${JSON.stringify({
            version: 2,
            batchId: 'priority-builder-proof',
            startedAt: new Date().toISOString(),
            batchSize: assets.length,
            builderRevision: master.builderRevision,
            assets,
          }, null, 2)}\n`);
          NODE

      - name: Generate exact priority assets
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --factory-startup \
            --python tools/asset-factory/blender/generate_batch.py -- \
            --batch asset-factory/work/current-batch.json \
            --report asset-factory/work/blender-report.json \
            --preview-dir asset-factory/work/previews \
            --output-root public/assets/models/generated

      - name: Require both dedicated assets to pass
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, statSync } from 'node:fs';
          const report = JSON.parse(readFileSync('asset-factory/work/blender-report.json', 'utf8'));
          if (report.passed !== 2 || report.failed !== 0) {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          for (const result of report.results) {
            if (!result.outputPath || !existsSync(result.outputPath) || statSync(result.outputPath).size < 1024) {
              throw new Error(`Invalid output for ${result.id}.`);
            }
          }
          console.log('[priority-proof] dedicated airlock conduit and open accessibility gate both passed.');
          NODE

      - name: Upload exact shape proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zaylins-priority-builder-proof-${{ github.run_number }}
          path: |
            asset-factory/work/current-batch.json
            asset-factory/work/blender-report.json
            asset-factory/work/previews/
            public/assets/models/generated/
          if-no-files-found: warn
          retention-days: 7
