name: Generate Free ZTA Asset Batch

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Assets to process in this run, capped at 20
        required: false
        default: '20'
  schedule:
    - cron: '17,47 * * * *'
  pull_request:
    paths:
      - 'asset-factory/**'
      - 'tools/asset-factory/**'
      - 'docs/**/*.md'
      - 'package.json'
      - '.github/workflows/generate-free-asset-factory.yml'
  push:
    branches: [main, agent/gameplay-gap-asset-expansion]
    paths:
      - 'asset-factory/**'
      - 'tools/asset-factory/**'
      - 'docs/**/*.md'
      - 'package.json'
      - '.github/workflows/generate-free-asset-factory.yml'

permissions:
  contents: write

concurrency:
  group: zta-free-asset-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install free Blender engine and headless graphics runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blender \
            python3-numpy \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxkbcommon0
          blender --version
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-expr "import numpy; print('Blender NumPy', numpy.__version__)"

      - name: Validate factory source
        shell: bash
        run: |
          node --check tools/asset-factory/compile-expanded-specs.mjs
          node --check tools/asset-factory/normalize-production-contracts.mjs
          node --check tools/asset-factory/build-runtime-deliverables.mjs
          node --check tools/asset-factory/audit-factory-health.mjs
          node --check tools/asset-factory/run-batch.mjs
          python3 -m py_compile \
            tools/asset-factory/blender/common.py \
            tools/asset-factory/blender/builders.py \
            tools/asset-factory/blender/builder_repair_utils.py \
            tools/asset-factory/blender/builder_repairs_legacy.py \
            tools/asset-factory/blender/builder_repairs_modular.py \
            tools/asset-factory/blender/builder_repairs_food.py \
            tools/asset-factory/blender/builder_repairs.py \
            tools/asset-factory/blender/generate_batch.py

      - name: Generate and quality-check next diversified batch
        shell: bash
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          mkdir -p asset-factory/work
          set -o pipefail
          node tools/asset-factory/run-batch.mjs --batch-size "$BATCH_SIZE" 2>&1 | tee asset-factory/work/factory.log

      - name: Require a healthy proof batch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, statSync } from 'node:fs';
          const result = JSON.parse(readFileSync('reports/asset-factory/latest.json', 'utf8'));
          if (!Array.isArray(result.results)) {
            console.log('[asset-factory] no queued proof batch remained; health audit completed instead.');
            process.exit(0);
          }
          const passedResults = result.results.filter((asset) => asset.passed);
          const invalidOutputs = passedResults.filter((asset) => !asset.outputPath || !existsSync(asset.outputPath) || statSync(asset.outputPath).size < 1024);
          const passRate = result.requested ? result.passed / result.requested : 1;
          console.log(`[asset-factory] proof result: ${result.passed}/${result.requested} passed (${Math.round(passRate * 100)}%)`);
          if (passRate < 0.70 || invalidOutputs.length) {
            console.error('The repaired factory must pass at least 70% of its diversified proof batch, and every accepted GLB must exist and be nonempty.');
            if (invalidOutputs.length) console.error('Invalid accepted outputs:', invalidOutputs.map((asset) => asset.id));
            process.exit(1);
          }
          NODE

      - name: Commit passing assets, runtime deliverables, queue state, and reports
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-factory/gameplay-gaps/
          git add asset-factory/generated/
          git add asset-factory/state/
          git add public/assets/models/generated/
          git add public/assets/models/asset-index-v2.json
          git add public/assets/runtime/generated/
          git add public/assets/decals/generated/
          git add reports/asset-factory/
          git add docs/FINAL_GAMEPLAY_GAPS.md
          if git diff --cached --quiet; then
            echo "No asset-factory changes to commit."
            exit 0
          fi
          git commit -m "Generate free asset-factory batch [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload temporary QA previews and health proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zta-asset-factory-qa-${{ github.run_number }}
          path: |
            asset-factory/work/previews/
            asset-factory/work/current-batch.json
            asset-factory/work/blender-report.json
            asset-factory/work/factory.log
            asset-factory/generated/master-asset-specs.json
            asset-factory/state/queue.json
            asset-factory/state/builder-health.json
            public/assets/models/generated/
            public/assets/runtime/generated/
            public/assets/decals/generated/
            reports/asset-factory/latest.json
            reports/asset-factory/health.json
            reports/asset-factory/health.md
          if-no-files-found: warn
          retention-days: 7
