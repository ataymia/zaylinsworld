name: Project Checks

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Integrity, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project integrity
        run: npm run check:project

      - name: Test animation state machine
        run: node --test tests/animationStateMachine.test.mjs

      - name: Test save-state migration
        run: node --test tests/state.test.mjs

      - name: Test asset resolution
        run: node --test tests/assets.test.mjs

      - name: Test character role pools
        run: node --test tests/characterPools.test.mjs

      - name: Test character skin adapter
        run: node --test tests/avatarSkin.test.mjs

      - name: Test procedural character motion
        run: node --test tests/characterMotion.test.mjs

      - name: Test Police Station conversations
        run: node --test tests/conversations.test.mjs

      - name: Test Starter Town interior structure
        run: node --test tests/starterTown.test.mjs

      - name: Test town registry and streaming policy
        run: node --test tests/townRegistry.test.mjs

      - name: Run complete regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build
